trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
# Install Node
- task: NodeTool@1
  inputs:
    versionSpec: '18.x'

# Install dependencies
- script: npm install
  displayName: Install dependencies

# Build Docker image
- task: Docker@2
  displayName: Build Docker Image
  inputs:
    command: build
    Dockerfile: 'Dockerfile'
    tags: latest